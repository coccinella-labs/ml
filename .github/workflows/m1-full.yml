name: m1-full-ci

concurrency:
  group: m1-full-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'Dockerfile'

jobs:
  build-test:
    runs-on: macos-14
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          # Keyed on the brew command itself, not CMakeLists.txt. Bottles are
          # downloaded rather than built, so caching only helps while the
          # formulae are unchanged.
          key: ${{ runner.os }}-brew-v1
          restore-keys: ${{ runner.os }}-brew-

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # openssl@1.1 is deprecated and disabled, but runner images ship it
          # owning /opt/homebrew/bin/openssl. That blocks the openssl@3 link
          # pulled in below. `brew unlink` reports "0 symlinks removed" and
          # leaves the file in place, because the symlink is laid down outside
          # Homebrew's link database, so remove it directly when it is the stale
          # 1.1 pointer and leave any legitimate link alone.
          brew unlink openssl@1.1 || true
          if [ -L /opt/homebrew/bin/openssl ] && \
             [ "$(readlink /opt/homebrew/bin/openssl)" = "/opt/homebrew/opt/openssl@1.1/bin/openssl" ]; then
            rm -f /opt/homebrew/bin/openssl
          fi
          brew install cmake open-mpi eigen nlohmann-json cpprestsdk boost googletest

      - name: Configure
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.logicalcpu)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy build-essential libopenmpi-dev libeigen3-dev \
            libcpprest-dev nlohmann-json3-dev libboost-all-dev libgtest-dev python3-pip
          python3 -m pip install cmakelint

      - name: Configure (for compilation database)
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Lint CMake
        run: cmakelint CMakeLists.txt

      - name: Lint C++ with clang-tidy
        run: |
          cd build
          find ../src ../include ../tests -name "*.cpp" -o -name "*.h" -print0 | xargs -0 clang-tidy --warnings-as-errors=* -p .

  label-pr:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const labels = [];
            if (needs.lint.result === 'success') {
              labels.push('lint:passed');
            } else {
              labels.push('lint:failed');
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: distributed-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker container for integration test
        run: |
          docker run -d --name distributed-ml-test -p 8080:8080 distributed-ml:latest
          sleep 10
          if ! docker exec distributed-ml-test curl -f http://localhost:8080; then
            echo "Dashboard not responding!"
            docker logs distributed-ml-test
            exit 1
          fi
          docker stop distributed-ml-test
          docker rm distributed-ml-test
