name: m1-full-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'Dockerfile'

jobs:
  build-test:
    runs-on: macos-14
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake open-mpi opencv eigen nlohmann-json cpprestsdk boost googletest

      - name: Configure
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.logicalcpu)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy build-essential libopenmpi-dev libeigen3-dev \
            libcpprest-dev nlohmann-json3-dev libboost-all-dev libgtest-dev

      - name: Configure (for compilation database)
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Lint CMake
        run: cmakelint CMakeLists.txt

      - name: Lint C++ with clang-tidy
        run: |
          cd build
          find ../src ../include ../tests -name "*.cpp" -o -name "*.h" -print0 | xargs -0 clang-tidy --warnings-as-errors=* -p .

  label-pr:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const labels = [];
            if (needs.lint.result === 'success') {
              labels.push('lint:passed');
            } else {
              labels.push('lint:failed');
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: distributed-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker container for integration test
        run: |
          docker run -d --name distributed-ml-test -p 8080:8080 distributed-ml:latest
          sleep 10
          if ! curl -f http://localhost:8080; then
            echo "Dashboard not responding!"
            docker logs distributed-ml-test
            exit 1
          fi
          docker stop distributed-ml-test
          docker rm distributed-ml-test
