name: m1 review

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'

jobs:
  cmake-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cmake-lint
      run: pip install cmakelint
    - name: Lint CMake
      run: cmakelint CMakeLists.txt

  cpp-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y clang-tidy cmake libopenmpi-dev libeigen3-dev libcpprest-dev nlohmann-json3-dev libboost-all-dev libgtest-dev
    - name: Configure
      run: mkdir build && cd build && cmake ..
    - name: Lint C++
      run: find src include tests -name "*.cpp" -o -name "*.h" | xargs clang-tidy --warnings-as-errors=* -p build

  label-pr:
    runs-on: ubuntu-latest
    needs: [cmake-lint, cpp-lint]
    if: always()
    steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          const labels = [];
          if ('${{ needs.cmake-lint.result }}' === 'success' && '${{ needs.cpp-lint.result }}' === 'success') {
            labels.push('lint:passed');
          } else {
            labels.push('lint:failed');
          }
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: labels
          });