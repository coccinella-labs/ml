name: m1-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'

jobs:
  build-test:
    runs-on: macos-14
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake open-mpi opencv eigen nlohmann-json cpprestsdk boost googletest

      - name: Configure
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.logicalcpu)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake-lint
        run: pip install cmakelint

      - name: Lint CMake
        run: cmakelint CMakeLists.txt

      - name: Install cpp-lint dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libopenmpi-dev libeigen3-dev libcpprest-dev nlohmann-json3-dev libboost-all-dev libgtest-dev

      - name: Lint C++
        run: find src include tests -name "*.cpp" -o -name "*.h" -print0 | xargs -0 clang-tidy --warnings-as-errors=* -p build

  label-pr:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const labels = [];
            if (needs.lint.result === 'success') {
              labels.push('lint:passed');
            } else {
              labels.push('lint:failed');
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });
